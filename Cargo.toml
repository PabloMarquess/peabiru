[workspace]
resolver = "2"
members = [
    "crates/peabiru-core",
    "crates/peabiru-trace",
    "crates/peabiru-discovery",
    "crates/peabiru-lua",
    "crates/peabiru-tui",
    "crates/peabiru-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/PabloMarquess/peabiru"
description = "Peabiru — end-to-end network path intelligence"

[workspace.dependencies]
peabiru-core = { path = "crates/peabiru-core" }
peabiru-trace = { path = "crates/peabiru-trace" }
peabiru-discovery = { path = "crates/peabiru-discovery" }
peabiru-lua = { path = "crates/peabiru-lua" }
peabiru-tui = { path = "crates/peabiru-tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
