# Cliente e banco ficam em nós diferentes para o tráfego atravessar a rede
# entre nós, como entre duas ENIs na AWS. O CNI padrão (kindnet) aplica
# NetworkPolicy desde o kind 0.24.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
