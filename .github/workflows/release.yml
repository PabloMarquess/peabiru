name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the GitHub release for the pushed tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/release.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
