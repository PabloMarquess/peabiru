[package]
name = "peabiru-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Peabiru CLI: the `pb` command, also installed as `peabiru` (TUI, trace, graph dump, rules check)"
default-run = "pb"

[[bin]]
name = "pb"
path = "src/bin/pb.rs"

[[bin]]
name = "peabiru"
path = "src/bin/peabiru.rs"

[dependencies]
peabiru-core = { workspace = true }
peabiru-trace = { workspace = true }
peabiru-discovery = { workspace = true }
peabiru-lua = { workspace = true }
peabiru-tui = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
